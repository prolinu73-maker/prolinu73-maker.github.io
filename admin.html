<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 페이지 · 조효식 허브 PRO</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="common.css?v=10">
<script src="common.js?v=26"></script>
<style>
  :root {
    --accent: #2563EB; --accent-d: #1D4ED8; --accent-soft: #EEF4FF;
    --bg: #F1F5F9; --card: #fff; --line: #E2E8F0; --line2: #CBD5E1;
    --text: #0F172A; --sub: #475569; --muted: #94A3B8;
    --ok: #16A34A; --warn: #D97706; --bad: #DC2626;
    --side: 232px; --top: 60px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); font-size: 14.5px; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }

  /* ── 상단 상태바 ── */
  .top { position: fixed; inset: 0 0 auto 0; height: var(--top); z-index: 50; background: #0F172A; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 18px; }
  .top #hubHomeBtn { margin-right: 4px; }
  .top .brand { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .top .brand small { font-weight: 600; color: #94A3B8; margin-left: 6px; font-size: 12.5px; }
  .top .conn { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: #334155; color: #CBD5E1; white-space: nowrap; }
  .top .conn.on { background: #14532D; color: #BBF7D0; }
  .top .spacer { flex: 1; }
  .top .dirty { font-size: 13px; font-weight: 800; padding: 5px 11px; border-radius: 999px; background: #334155; color: #CBD5E1; white-space: nowrap; }
  .top .dirty.has { background: #F59E0B; color: #1C1917; }
  .top .tbtn { border: none; border-radius: 9px; padding: 9px 15px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .top .tbtn.ghost { background: #1E293B; color: #E2E8F0; border: 1px solid #475569; }
  .top .tbtn.ghost:hover { background: #334155; }
  .top .tbtn.pri { background: var(--accent); color: #fff; }
  .top .tbtn.pri:hover { background: var(--accent-d); }
  .top .tbtn:disabled { opacity: .45; cursor: not-allowed; }
  .top .menu-toggle { display: none; background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }

  /* ── 좌측 사이드바 ── */
  .side { position: fixed; top: var(--top); bottom: 0; left: 0; width: var(--side); background: #fff; border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; z-index: 40; }
  .side .sec { font-size: 11.5px; font-weight: 800; color: var(--muted); padding: 12px 10px 6px; letter-spacing: .02em; }
  .side button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: none; padding: 10px 12px; border-radius: 9px; font-weight: 700; color: var(--sub); cursor: pointer; }
  .side button:hover { background: #F1F5F9; color: var(--text); }
  .side button.on { background: var(--accent-soft); color: var(--accent-d); }
  .side button .cnt { margin-left: auto; font-size: 11.5px; background: #E2E8F0; color: var(--sub); border-radius: 999px; padding: 1px 8px; }
  .side .home { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  .side .home a { display: block; padding: 10px 12px; border-radius: 9px; font-weight: 700; color: var(--sub); text-decoration: none; }
  .side .home a:hover { background: #F1F5F9; }

  /* ── 메인 ── */
  main { margin-left: var(--side); padding: calc(var(--top) + 22px) 26px 60px; max-width: calc(1180px + var(--side)); }
  .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-h h1 { margin: 0; font-size: 23px; letter-spacing: -0.02em; }
  .page-h p { margin: 4px 0 0; color: var(--sub); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 14px; font-size: 16.5px; display: flex; align-items: center; gap: 8px; }
  .card h2 .r { margin-left: auto; display: flex; gap: 6px; }
  .hint { color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; }
  .full { grid-column: 1 / -1; }
  label.f { display: block; font-size: 13px; font-weight: 800; color: #334155; margin-bottom: 6px; }
  label.f small { font-weight: 600; color: var(--muted); }
  .in, select.in, textarea.in { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line2); border-radius: 9px; background: #fff; color: var(--text); }
  .in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.13); }
  textarea.in { min-height: 90px; resize: vertical; line-height: 1.6; }
  .btn { border: 1.5px solid var(--line2); background: #fff; color: var(--text); border-radius: 9px; padding: 8px 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.pri:hover { background: var(--accent-d); color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn.danger:hover { border-color: var(--bad); background: #FEF2F2; }
  .btn.sm { padding: 5px 9px; font-size: 12.5px; border-radius: 7px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chk { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; cursor: pointer; }
  .chk input { width: 17px; height: 17px; accent-color: var(--accent); }

  /* 스위치 */
  .switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 800; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .tr { width: 46px; height: 26px; border-radius: 999px; background: #CBD5E1; position: relative; transition: background .2s; flex-shrink: 0; }
  .switch .tr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
  .switch input:checked + .tr { background: var(--accent); }
  .switch input:checked + .tr::after { left: 23px; }
  .switch input:focus-visible + .tr { outline: 3px solid #93C5FD; outline-offset: 2px; }
  .switch.warn input:checked + .tr { background: #F97316; }

  /* 요약 카드 */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .stat .n { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12.5px; font-weight: 700; color: var(--sub); margin-top: 2px; }
  .stat.ok .n { color: var(--ok); } .stat.warn .n { color: var(--warn); } .stat.mute .n { color: var(--muted); } .stat.acc .n { color: var(--accent); }

  /* 표 */
  .tbl-wrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.t th { text-align: left; font-size: 12px; color: var(--sub); font-weight: 800; padding: 9px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; background: #F8FAFC; }
  table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.t tr.drag-over td { background: var(--accent-soft); }
  table.t tr[draggable="true"] { cursor: grab; }
  .handle { cursor: grab; color: var(--muted); font-size: 16px; user-select: none; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .st-active { background: #DCFCE7; color: #166534; } .st-maintenance { background: #FEF3C7; color: #92400E; } .st-hidden { background: #E2E8F0; color: #475569; }
  .lv-info { background: #DBEAFE; color: #1E40AF; } .lv-warning { background: #FEF3C7; color: #92400E; } .lv-danger { background: #FEE2E2; color: #991B1B; }
  .b-NEW { background: #EF4444; color: #fff; } .b-BETA { background: #7C3AED; color: #fff; } .b-UPDATE { background: #0EA5E9; color: #fff; }
  .ty { background: #F1F5F9; color: #334155; }
  .muted { color: var(--muted); }
  .mono { font-family: Consolas, 'D2Coding', monospace; font-size: 12.5px; }
  .ellip { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 26px 10px; }

  /* 알림 */
  .alert { border-radius: 11px; padding: 12px 15px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; line-height: 1.6; }
  .alert.info { background: #EFF6FF; border: 1px solid #BFDBFE; color: #1E3A8A; }
  .alert.warn { background: #FFFBEB; border: 1px solid #FDE68A; color: #78350F; }
  .alert.bad { background: #FEF2F2; border: 1px solid #FECACA; color: #7F1D1D; }
  .alert.ok { background: #F0FDF4; border: 1px solid #BBF7D0; color: #14532D; }
  .alert .r { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }

  /* 창(모달) */
  .mback { position: fixed; inset: 0; z-index: 100; background: rgba(15,23,42,.55); display: flex; align-items: flex-start; justify-content: center; padding: 40px 14px; overflow-y: auto; }
  .modal { background: #fff; border-radius: 16px; width: 640px; max-width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  .modal.wide { width: 860px; }
  .modal .mh { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .modal .mh h3 { margin: 0; font-size: 18px; }
  .modal .mh .x { margin-left: auto; border: none; background: none; font-size: 24px; cursor: pointer; color: var(--muted); line-height: 1; }
  .modal .mb { padding: 20px 22px; }
  .modal .mf { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; background: #F8FAFC; border-radius: 0 0 16px 16px; }

  /* Diff */
  .diff { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; max-height: 320px; overflow-y: auto; }
  .diff li { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; }
  .diff li:first-child { border-top: none; }
  .diff .k { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; }
  .diff .k.add { background: #DCFCE7; color: #166534; } .diff .k.mod { background: #DBEAFE; color: #1E40AF; } .diff .k.del { background: #FEE2E2; color: #991B1B; }
  .diff .d { color: var(--sub); font-size: 12.5px; }

  /* 변경이력 편집 */
  .loglist { list-style: none; margin: 0 0 10px; padding: 0; border: 1px solid var(--line); border-radius: 10px; }
  .loglist li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); }
  .loglist li:first-child { border-top: none; }
  .loglist .d { font-weight: 800; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .loglist .n { flex: 1; }
  .emoji-pick { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .emoji-pick button { border: 1px solid var(--line); background: #fff; border-radius: 7px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; }
  .emoji-pick button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .seg { display: inline-flex; border: 1.5px solid var(--line2); border-radius: 9px; overflow: hidden; }
  .seg label { cursor: pointer; }
  .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .seg span { display: block; padding: 8px 13px; font-weight: 700; color: var(--sub); border-left: 1px solid var(--line2); }
  .seg label:first-child span { border-left: none; }
  .seg input:checked + span { background: var(--accent); color: #fff; }
  .seg input:focus-visible + span { outline: 2px solid #93C5FD; outline-offset: -2px; }

  /* 알림(토스트) */
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 300; background: #1F2937; color: #fff; padding: 12px 20px; border-radius: 10px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 92vw; display: none; }
  #toast.show { display: block; }
  #toast.bad { background: #991B1B; }

  .hc-ok { color: var(--ok); font-weight: 800; } .hc-bad { color: var(--bad); font-weight: 800; } .hc-unk { color: var(--warn); font-weight: 800; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #CBD5E1; border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  @media (max-width: 980px) {
    .side { transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.2); }
    .side.open { transform: none; }
    main { margin-left: 0; padding-left: 14px; padding-right: 14px; }
    .top .menu-toggle { display: block; }
    .top .brand small, .top .conn { display: none; }
    .grid2, .grid3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ───────── 상단 상태바 ───────── -->
<header class="top">
  <button class="menu-toggle" onclick="document.querySelector('.side').classList.toggle('open')" aria-label="메뉴 열기">☰</button>
  <!-- '홈으로' 버튼: 다른 페이지(노무·예산·여비 등)와 같은 모양 (common.js가 그림) -->
  <span data-hub-home></span><script>if (window.HUB && HUB.mountHomeButton) HUB.mountHomeButton({ title: '포털 첫 화면(index.html)으로 이동합니다' });</script>
  <div class="brand">⚙️ 관리자 페이지<small>조효식 허브 PRO</small></div>
  <span class="conn" id="connBadge">연결 안 됨</span>
  <span class="spacer"></span>
  <span class="dirty" id="dirtyBadge" title="배포되지 않은 변경 건수">변경 없음</span>
  <button class="tbtn ghost" id="btnPreview" onclick="openPreview()" title="편집 중인 내용으로 첫 화면을 새 탭에서 미리 봅니다">👀 미리보기</button>
  <button class="tbtn pri" id="btnDeploy" onclick="openDeploy()" title="변경 내용을 GitHub에 저장해 사이트에 반영합니다">🚀 저장·배포</button>
</header>

<!-- ───────── 좌측 사이드바 ───────── -->
<nav class="side" aria-label="관리 메뉴">
  <div class="sec">시작</div>
  <button data-page="connect">🔑 연결 설정</button>
  <button data-page="dashboard">📊 대시보드</button>
  <div class="sec">내용 관리</div>
  <button data-page="site">🏠 사이트 설정·점검 모드</button>
  <button data-page="notices">📢 공지·배너·팝업 <span class="cnt" id="cntNotices">0</span></button>
  <button data-page="events">📅 업무 달력 <span class="cnt" id="cntEvents">0</span></button>
  <button data-page="categories">🗂 카테고리 <span class="cnt" id="cntCats">0</span></button>
  <button data-page="items">🧩 콘텐츠(프로그램) <span class="cnt" id="cntItems">0</span></button>
  <div class="sec">배포·보관</div>
  <button data-page="history">🕘 배포 이력·롤백</button>
  <button data-page="backup">💾 백업·복원</button>
  <div class="home"><a href="index.html" target="_blank" rel="noopener">🌐 사이트 열기 ↗</a></div>
</nav>

<main id="main"></main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   조효식 허브 PRO · 관리자 페이지 (admin.html)
   - data/site-config.json 을 GitHub REST API로 읽고, 고치고, 커밋(배포)합니다.
   - 서버 없이 이 파일 하나로 동작합니다. 비밀 값(토큰)은 코드에 넣지 않습니다.
   - 토큰은 기본적으로 '이 창(sessionStorage)'에만 보관하고, 원하면 '이 PC(localStorage)'에 보관합니다.
   ===================================================================== */

/* ───────── 1. 기본값 · 저장소 키 ───────── */
const DEFAULT_CONN = { owner: 'prolinu73-maker', repo: 'prolinu73-maker.github.io', branch: 'main', path: 'data/site-config.json' };
const K = {
  conn: 'adminConn',            // 연결 정보(토큰 제외)
  token: 'adminGhToken',        // 토큰 (session 또는 local)
  draft: 'adminDraft',          // 자동 임시저장
  preview: 'siteConfigPreview', // 미리보기용 (index.html?preview=1이 읽음)
  page: 'adminPage'
};
const API = 'https://api.github.com';
const STATUS = { active: '사용 중', maintenance: '점검 중', hidden: '숨김' };
const TYPES = { banner: '배너', popup: '팝업', list: '목록' };
const LEVELS = { info: '안내', warning: '주의', danger: '긴급' };
const EV_CATS = { '세무': '#E07A2F', '회계': '#1F6FB2', '인사': '#7C5CD6', '보험': '#1A9C7B', '학교운영': '#E0598B', '기타': '#64748B' };
const EV_REPEAT = { none: '한 번', monthly: '매월', yearly: '매년' };
// 첫 화면 '이달의 업무 달력' 기본 일정 (index.html의 DEFAULT_EVENTS와 같음)
const DEFAULT_EVENTS = [
  { id: 'ev-wht', title: '원천세·지방소득세 신고·납부 기한', date: '2026-01-10', repeat: 'monthly', category: '세무', memo: '전월 지급분 원천징수이행상황신고', link: '', active: true },
  { id: 'ev-ys', title: '연말정산 간소화 자료 제공 시작', date: '2026-01-15', repeat: 'yearly', category: '세무', memo: '국세청 홈택스', link: 'https://www.hometax.go.kr', active: true },
  { id: 'ev-bud', title: '학교회계 예산안 학교운영위원회 제출 기한', date: '2026-01-30', repeat: 'yearly', category: '회계', memo: '회계연도 시작 30일 전까지', link: '', active: true },
  { id: 'ev-sfy', title: '학교회계연도 시작', date: '2026-03-01', repeat: 'yearly', category: '회계', memo: '3월 1일 ~ 다음 해 2월 말일', link: '', active: true },
  { id: 'ev-wage', title: '근로소득 지급명세서 제출 기한', date: '2026-03-10', repeat: 'yearly', category: '세무', memo: '전년도 연말정산 결과 제출', link: '', active: true },
  { id: 'ev-nhis', title: '건강보험 보수총액 통보 기한', date: '2026-03-10', repeat: 'yearly', category: '보험', memo: '직장가입자 전년도 보수총액', link: '', active: true },
  { id: 'ev-ei', title: '고용·산재보험 보수총액 신고 기한', date: '2026-03-15', repeat: 'yearly', category: '보험', memo: '전년도 보수총액', link: '', active: true },

/* ───────── 4. 한글이 깨지지 않는 Base64 (UTF-8) ───────── */
function b64EncodeUtf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64DecodeUtf8(b64) {
  const bin = atob(String(b64 || '').replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

/* ───────── 5. GitHub API ───────── */
async function gh(path, opt) {
  opt = opt || {};
  if (!S.token) throw Object.assign(new Error('토큰이 없습니다. [연결 설정]에서 토큰을 넣어 주세요.'), { status: 0 });
  const res = await fetch(API + path, {
    method: opt.method || 'GET',
    headers: Object.assign({
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + S.token,
      'X-GitHub-Api-Version': '2022-11-28'
    }, opt.body ? { 'Content-Type': 'application/json' } : {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined,
    cache: 'no-store'
  });
  let data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.message) || ('HTTP ' + res.status));
    err.status = res.status; err.data = data; throw err;
  }
  return data;
}
const repoPath = () => `/repos/${encodeURIComponent(S.conn.owner)}/${encodeURIComponent(S.conn.repo)}`;
const filePath = () => S.conn.path.split('/').map(encodeURIComponent).join('/');
function ghErrMsg(e) {
  if (e.status === 401) return '토큰이 맞지 않거나 만료되었습니다. 새 토큰을 넣어 주세요. (401)';
  if (e.status === 403) return '권한이 없습니다. 토큰의 저장소 권한(Contents: Read and write)을 확인해 주세요. (403)';
  if (e.status === 404) return '저장소 또는 파일을 찾지 못했습니다. 소유자·저장소·경로를 확인해 주세요. (404)';
  if (e.status === 409) return '다른 곳에서 먼저 파일이 바뀌었습니다. [최신 불러오기] 후 다시 배포해 주세요. (409)';
  if (e.status === 422) return '요청 내용이 올바르지 않습니다. 파일 경로나 내용을 확인해 주세요. (422)';
  if (e.status === 0) return e.message;

}
async function ghGetFile(ref) {
  const q = '?ref=' + encodeURIComponent(ref || S.conn.branch);
  const d = await gh(`${repoPath()}/contents/${filePath()}${q}`);
  if (Array.isArray(d)) throw Object.assign(new Error('경로가 파일이 아니라 폴더입니다.'), { status: 422 });
  let text;
  if (d.content) text = b64DecodeUtf8(d.content);
  else if (d.download_url) text = await (await fetch(d.download_url + (d.download_url.includes('?') ? '&' : '?') + 't=' + Date.now())).text();   // 1MB 넘는 파일
  else text = '';
  return { json: JSON.parse(text), sha: d.sha };
}
async function ghPutFile(obj, message, sha) {
  const body = { message, content: b64EncodeUtf8(JSON.stringify(obj, null, 2) + '\n'), branch: S.conn.branch };
  if (sha) body.sha = sha;   // 충돌 방지: 불러올 때 받은 sha를 꼭 함께 보냄
  return gh(`${repoPath()}/contents/${filePath()}`, { method: 'PUT', body });
}

/* ───────── 6. 데이터 기본 모양 맞추기 (빠진 칸 채우기) ───────── */
function normalize(c) {
  c = c && typeof c === 'object' ? c : {};
  c.meta = Object.assign({ version: '1.0.0', updatedAt: '', updatedBy: '' }, c.meta || {});
  c.site = Object.assign({ title: '', subtitle: '', themeColor: '#2563eb', footerText: '' }, c.site || {});
  c.site.maintenance = Object.assign({ enabled: false, message: '시스템 점검 중입니다. 잠시 후 다시 접속해 주세요.', endTime: '' }, c.site.maintenance || {});
  c.site.analytics = Object.assign({ ga4Id: '', cloudflareToken: '' }, c.site.analytics || {});
  c.notices = Array.isArray(c.notices) ? c.notices : [];
  c.events = Array.isArray(c.events) ? c.events : JSON.parse(JSON.stringify(DEFAULT_EVENTS));   // 처음엔 기본 일정을 채워 둠
  c.categories = Array.isArray(c.categories) ? c.categories : [];
  c.items = Array.isArray(c.items) ? c.items : [];
  c.items.forEach(i => { i.tags = Array.isArray(i.tags) ? i.tags : []; i.changelog = Array.isArray(i.changelog) ? i.changelog : []; });
  return c;
}

const FIELD_NAMES = {
  title: '제목', subtitle: '부제', themeColor: '테마 색', footerText: '꼬리말', 'maintenance.enabled': '점검 모드', 'maintenance.message': '점검 안내 문구',
  'maintenance.endTime': '점검 종료 시간', 'analytics.ga4Id': 'GA4 ID', 'analytics.cloudflareToken': 'Cloudflare 토큰',
  type: '유형', level: '중요도', content: '내용', link: '링크', startDate: '시작일', endDate: '종료일', active: '활성', dismissKey: '다시보지않기 키',
  name: '이름', order: '순서', visible: '표시', categoryId: '카테고리', description: '설명', url: '주소', openInNewTab: '새 탭', icon: '아이콘',
  badge: '배지', status: '상태', version: '버전', tags: '태그', changelog: '변경이력'
};
function flat(o, p, out) {
  out = out || {}; p = p || '';
  Object.keys(o || {}).forEach(k => {
    const v = o[k], key = p ? p + '.' + k : k;
    if (v && typeof v === 'object' && !Array.isArray(v)) flat(v, key, out); else out[key] = v;
  });
  return out;
}
function diffList(a, b, label, nameOf) {
  const out = [], am = new Map(a.map(x => [x.id, x])), bm = new Map(b.map(x => [x.id, x]));
  b.forEach(x => {
    const o = am.get(x.id);
    if (!o) out.push({ k: 'add', t: `${label} 추가: ${nameOf(x)}` });
    else if (!same(o, x)) {
      const fields = Object.keys(Object.assign({}, o, x)).filter(f => !same(o[f], x[f])).map(f => FIELD_NAMES[f] || f);
      out.push({ k: 'mod', t: `${label} 수정: ${nameOf(x)}`, d: fields.join(', ') });
    }
  });
  a.forEach(x => { if (!bm.has(x.id)) out.push({ k: 'del', t: `${label} 삭제: ${nameOf(x)}` }); });
  return out;
}
function computeDiff() {
  if (!S.draft) return [];
  const a = normalize(clone(S.original || emptyConfig())), b = S.draft;
  const out = [];
  const fa = flat(a.site), fb = flat(b.site);
  Object.keys(Object.assign({}, fa, fb)).forEach(k => {
    if (!same(fa[k], fb[k])) out.push({ k: 'mod', t: '사이트 설정: ' + (FIELD_NAMES[k] || k), d: k === 'analytics.cloudflareToken' ? '' : `${short(fa[k])} → ${short(fb[k])}` });
  });
  out.push(...diffList(a.notices, b.notices, '공지', x => x.title || x.id));
  out.push(...diffList(a.events, b.events, '업무 달력', x => x.title || x.id));
  out.push(...diffList(a.categories, b.categories, '카테고리', x => x.name || x.id));
  out.push(...diffList(a.items, b.items, '콘텐츠', x => x.title || x.id));
  return out;
}
const short = v => { const s = v === true ? '켬' : v === false ? '끔' : String(v == null || v === '' ? '(비어 있음)' : v); return s.length > 30 ? s.slice(0, 30) + '…' : s; };

function healthTargets() {
  const out = [];
  S.draft.items.forEach(i => { if (i.url) out.push({ name: '콘텐츠 · ' + i.title, url: i.url, internal: isInternal(i.url) }); });
  S.draft.notices.forEach(n => { if (n.link) out.push({ name: '공지 · ' + n.title, url: n.link, internal: isInternal(n.link) }); });
  return out;
}
const isInternal = u => /^\/(?!\/)/.test(u) || (!/^[a-z][a-z0-9+.-]*:/i.test(u) && !/^\/\//.test(u));
const openableUrl = u => isInternal(u) ? (u.startsWith('/') ? u : './' + u.replace(/^\.\//, '')) : (/^https?:\/\//i.test(u) ? u : '#');
async function checkOne(u) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    if (u.internal) {
      const url = openableUrl(u.url);
      const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'hc=' + Date.now(), { method: 'GET', cache: 'no-store', signal: ctrl.signal });
      return { state: r.ok ? 'ok' : 'bad', code: r.status };
    }
    if (!/^https?:\/\//i.test(u.url)) return { state: 'bad', code: '주소 형식' };
    await fetch(u.url, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });   // 도달만 확인 (응답 코드는 볼 수 없음)
    return { state: 'reach' };
  } catch (e) { return { state: 'bad', code: e.name === 'AbortError' ? '시간 초과' : '연결 실패' }; }
  finally { clearTimeout(t); }
}
async function runHealth() {
  const list = healthTargets(); if (!list.length) return;
  list.forEach(u => S.health[u.url] = { state: 'run' }); render();
  for (let i = 0; i < list.length; i += 4) {
    await Promise.all(list.slice(i, i + 4).map(async u => { S.health[u.url] = await checkOne(u); }));
    if (S.page === 'dashboard') render();
  }
  const bad = list.filter(u => S.health[u.url].state === 'bad').length;
  toast(bad ? `점검 완료 — 문제 있는 주소 ${bad}개` : '점검 완료 — 모두 정상입니다.', !!bad);
}
function commitTable(withRollback) {
  if (!S.token) return '<p class="empty">토큰으로 연결하면 이력을 볼 수 있습니다.</p>';
  if (S.commitErr && !S.commits.length) return `<p class="empty">${esc(S.commitErr)}</p>`;

      <div class="full"><label class="f" for="iTags">태그 <small>쉼표(,)로 구분</small></label><input class="in" id="iTags" value="${esc(it.tags.join(', '))}" placeholder="엑셀 불러오기, 검색"></div>
      <div class="full"><label class="f">변경이력 (Changelog)</label><ul class="loglist" id="iLog"></ul>
        <div class="row"><input class="in" type="date" id="iLogDate" value="${kToday()}" style="width:auto"><input class="in" id="iLogNote" placeholder="바뀐 내용 (예: 엑셀 내보내기 추가)" style="flex:1;min-width:180px"><button class="btn sm pri" type="button" id="iLogAdd">이력 추가</button></div></div>
    </div>`, [{ t: '취소' }, { t: isNew ? '추가' : '적용', pri: true, fn: () => {
      const v = Object.assign(it, {
        title: $('iTitle').value.trim(), categoryId: $('iCat').value, icon: $('iIcon').value.trim() || '📄',
        description: $('iDesc').value.trim(), url: $('iUrl').value.trim(), openInNewTab: $('iNew').checked,
        status: document.querySelector('input[name=iStatus]:checked').value, badge: document.querySelector('input[name=iBadge]:checked').value,
        version: $('iVer').value.trim(), tags: $('iTags').value.split(',').map(t => t.trim()).filter(Boolean), changelog: log
      });
      if (!v.title) { toast('프로그램명을 적어 주세요.', true); $('iTitle').focus(); return false; }
      if (v.url && /^javascript:/i.test(v.url)) { toast('이 주소는 쓸 수 없습니다.', true); return false; }
      if (isNew) { v.order = itemsIn(v.categoryId).length + 1; S.draft.items.push(v); }
      else {
        const old = itemById(id);
        if (old.categoryId !== v.categoryId) v.order = itemsIn(v.categoryId).length + 1;
        S.draft.items[S.draft.items.indexOf(old)] = v;
        if (old.categoryId !== v.categoryId) itemsIn(old.categoryId).forEach((x, k) => x.order = k + 1);
      }
      touched(true); toast(isNew ? '콘텐츠를 추가했습니다. (배포 전)' : '콘텐츠를 고쳤습니다. (배포 전)');
    } }], true);
  drawLog();
  $('iLogAdd').onclick = () => { const note = $('iLogNote').value.trim(); if (!note) return $('iLogNote').focus(); log.push({ date: $('iLogDate').value || kToday(), note }); $('iLogNote').value = ''; drawLog(); };
  $('iLogNote').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('iLogAdd').click(); } });
  setTimeout(() => $('iTitle').focus(), 30);
}

/* 끌어서 순서 바꾸기 (표의 tr[draggable]) */
function enableDrag(table, done) {
  if (!table) return;
  let dragEl = null;
  table.querySelectorAll('tbody tr[draggable="true"]').forEach(tr => {
    tr.addEventListener('dragstart', e => { dragEl = tr; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', tr.dataset.id); } catch (x) {} tr.style.opacity = '.4'; });
    tr.addEventListener('dragend', () => { tr.style.opacity = ''; table.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over')); });
    tr.addEventListener('dragover', e => { e.preventDefault(); tr.classList.add('drag-over'); });
    tr.addEventListener('dragleave', () => tr.classList.remove('drag-over'));
    tr.addEventListener('drop', e => {
      e.preventDefault(); tr.classList.remove('drag-over');
      if (!dragEl || dragEl === tr) return;
      const rows = [...table.querySelectorAll('tbody tr[draggable="true"]')];
      const from = rows.indexOf(dragEl), to = rows.indexOf(tr);
      tr.parentNode.insertBefore(dragEl, from < to ? tr.nextSibling : tr);
      done([...table.querySelectorAll('tbody tr[draggable="true"]')].map(r => r.dataset.id));
    });
  });
}

/* ── 11-7. 배포 이력 · 롤백 ── */
PAGES.history = function () {
  return `<div class="page-h"><div><h1>🕘 배포 이력·롤백</h1><p>설정 파일(<span class="mono">${esc(S.conn.path)}</span>)이 바뀐 최근 10번의 기록입니다.</p></div>
    <button class="btn" onclick="loadCommits()">새로고침</button></div>
  <div class="alert info">↩️ <div>[이 시점으로 복원]을 누르면 그때의 설정을 <b>편집 화면으로만</b> 불러옵니다. 내용을 확인한 뒤 [🚀 저장·배포]를 눌러야 사이트에 실제로 반영됩니다.</div></div>
  <div class="card">${commitTable(true)}</div>`;
};
async function rollbackTo(sha) {
  if (computeDiff().length && !confirm('지금 편집 중인(배포 안 된) 내용이 있습니다.\n그 시점의 설정으로 바꾸면 편집 내용이 사라집니다. 계속할까요?')) return;
  try {
    const f = await ghGetFile(sha);
    S.draft = normalize(f.json);
    touched(); go('dashboard');
    toast(`${sha.slice(0, 7)} 시점의 설정을 불러왔습니다. 확인 후 [저장·배포]를 누르면 복원이 확정됩니다.`);
  } catch (e) { toast(ghErrMsg(e), true); }
}

/* ── 11-8. 백업 · 복원 ── */
PAGES.backup = function () {
  return `<div class="page-h"><div><h1>💾 백업·복원</h1><p>편집 중인 설정을 JSON 파일로 내려받거나, 보관해 둔 JSON 파일을 불러옵니다.</p></div></div>
  <div class="card"><h2>⬇️ 내려받기 (백업)</h2>
    <p class="hint" style="margin-top:-6px">지금 편집 화면의 내용을 파일로 저장합니다. 큰 수정 전에 한 번씩 받아 두세요.</p>
    <div class="row"><button class="btn pri" onclick="downloadJson('draft')" ${S.draft ? '' : 'disabled'}>편집 중인 설정 내려받기</button>
    <button class="btn" onclick="downloadJson('original')" ${S.original ? '' : 'disabled'}>배포된 설정 내려받기</button></div></div>
  <div class="card"><h2>⬆️ 불러오기 (복원)</h2>
    <p class="hint" style="margin-top:-6px">JSON 파일을 고르면 편집 화면으로 불러옵니다. [저장·배포]를 눌러야 사이트에 반영됩니다.</p>
    <input type="file" id="upJson" accept=".json,application/json" class="in" style="max-width:420px"></div>
  <div class="card"><h2>🧹 이 브라우저의 임시저장</h2>
    <p class="hint" style="margin-top:-6px">자동 임시저장 내용과 미리보기 자료를 지웁니다. (GitHub의 파일은 그대로)</p>
    <button class="btn danger" onclick="store.del(K.draft);store.del(K.preview);S.pendingRestore=null;toast('임시저장을 지웠습니다.')">임시저장 지우기</button></div>`;
};
PAGES.backup.after = () => {
  $('upJson').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (!j || typeof j !== 'object' || (!j.site && !j.items)) throw new Error('site-config 형식이 아닙니다.');
      if (S.draft && computeDiff().length && !confirm('지금 편집 중인 내용이 파일 내용으로 바뀝니다. 계속할까요?')) return;
      S.draft = normalize(j); touched(); toast(`'${f.name}'을(를) 불러왔습니다. 확인 후 [저장·배포]하세요.`); go('dashboard');
    } catch (err) { toast('파일을 읽지 못했습니다: ' + err.message, true); }
    e.target.value = '';
  });
};
function downloadJson(which) {
  const obj = which === 'original' ? S.original : S.draft; if (!obj) return;
  const blob = new Blob([JSON.stringify(obj, null, 2) + '\n'], { type: 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `site-config_${which === 'original' ? '배포본' : '편집본'}_${kToday()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ───────── 12. 저장 · 배포 ───────── */
function validate(c) {
  const errs = [], ids = new Set();
  const dup = (arr, label) => arr.forEach(x => { if (!x.id) errs.push(`${label}에 id가 없는 항목이 있습니다.`); else if (ids.has(x.id)) errs.push(`id가 겹칩니다: ${x.id}`); else ids.add(x.id); });
  dup(c.notices, '공지'); dup(c.events, '업무 달력'); dup(c.categories, '카테고리');
  c.events.forEach(e => { if (!e.title) errs.push(`이름이 없는 달력 일정이 있습니다 (${e.id}).`); if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) errs.push(`'${e.title}' 일정의 날짜가 올바르지 않습니다.`); }); dup(c.items, '콘텐츠');
  const catIds = new Set(c.categories.map(x => x.id));
  c.items.forEach(i => { if (!i.title) errs.push(`제목이 없는 콘텐츠가 있습니다 (${i.id}).`); if (!catIds.has(i.categoryId)) errs.push(`'${i.title}'의 카테고리가 없습니다.`); });
  c.notices.forEach(n => { if (!n.title) errs.push(`제목이 없는 공지가 있습니다 (${n.id}).`); });
  if (c.site.themeColor && !/^#[0-9a-f]{3,8}$/i.test(c.site.themeColor)) errs.push('테마 색상 형식이 올바르지 않습니다. (예: #2563eb)');
  return errs;
}
function openDeploy() {
  if (!S.draft) return;
  const d = computeDiff();
  if (!d.length) return toast('배포할 변경 내용이 없습니다.');
  const errs = validate(S.draft);
  const noConn = !S.token || (!S.original && !S.missingFile);
  const def = d.length === 1 ? d[0].t : `${d[0].t} 외 ${d.length - 1}건`;
  modal('🚀 저장·배포', `
    ${noConn ? `<div class="alert bad">🔑 <div>GitHub에 연결되어 있지 않아 배포할 수 없습니다. [연결 설정]에서 토큰으로 연결해 주세요. 편집 내용은 임시저장되어 있습니다.</div></div>` : ''}
    ${errs.length ? `<div class="alert bad">⛔ <div><b>고쳐야 할 점이 있습니다.</b><br>${errs.map(esc).join('<br>')}</div></div>` : ''}
    <label class="f">바뀐 내용 (${d.length}건)</label>
    <ul class="diff">${d.map(x => `<li><span class="k ${x.k}">${{ add: '추가', mod: '수정', del: '삭제' }[x.k]}</span><span>${esc(x.t)}${x.d ? ` <span class="d">— ${esc(x.d)}</span>` : ''}</span></li>`).join('')}</ul>
    <label class="f" for="cMsg" style="margin-top:16px">커밋 메시지 <small>무엇을 바꿨는지 짧게</small></label>
    <input class="in" id="cMsg" value="${esc('설정 변경: ' + def)}" maxlength="120">
    <p class="hint" style="margin:10px 0 0">배포하면 1~2분 뒤 사이트에 반영됩니다. 버전은 자동으로 ${esc(S.draft.meta.version)} → ${esc(bumpVersion(S.draft.meta.version))}(으)로 올라갑니다.</p>`,
    [{ t: '취소' }, { t: '🚀 배포하기', pri: true, disabled: noConn || errs.length > 0, fn: doDeploy }], true);
}
async function doDeploy(btn) {
  const msg = ($('cMsg').value || '').trim() || '설정 변경';
  const next = clone(S.draft);
  next.meta = Object.assign({}, next.meta, { version: bumpVersion(next.meta.version), updatedAt: kNow(), updatedBy: S.login || S.conn.owner || 'admin' });
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 배포 중...';
  try {
    const r = await ghPutFile(next, msg, S.sha);
    S.sha = r.content && r.content.sha; S.original = clone(next); S.draft = clone(next); S.missingFile = false;
    store.del(K.draft); S.pendingRestore = null;
    closeModal(); updateTop(); pushPreview(); render();
    toast('✅ 배포했습니다. 1~2분 뒤 사이트에 반영됩니다.');
    loadCommits();
  } catch (e) {
    btn.disabled = false; btn.textContent = '🚀 배포하기';
    if (e.status === 409 || (e.status === 422 && /sha/i.test(e.message))) {
      if (confirm(ghErrMsg({ status: 409 }) + '\n\n지금 GitHub의 최신 파일을 불러올까요? (편집 내용은 임시저장되어 [복구하기]로 되살릴 수 있습니다)')) {
        store.set(K.draft, { draft: S.draft, baseSha: S.sha, savedAt: kNow(), conn: S.conn.owner + '/' + S.conn.repo + '/' + S.conn.path });
        closeModal(); await loadLatest();
      }
    } else toast(ghErrMsg(e), true);
  }
}

/* ───────── 13. 창(모달) ───────── */
let curModal = null;
function modal(title, body, buttons, wide) {
  closeModal();
  const back = document.createElement('div');
  back.className = 'mback';
  back.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="mh"><h3>${esc(title)}</h3><button class="x" aria-label="닫기">×</button></div>
    <div class="mb">${body}</div>
    <div class="mf">${buttons.map((b, i) => `<button class="btn${b.pri ? ' pri' : ''}" data-i="${i}" ${b.disabled ? 'disabled' : ''}>${b.t}</button>`).join('')}</div></div>`;
  document.body.appendChild(back);
  back.querySelector('.x').onclick = closeModal;
  back.addEventListener('mousedown', e => { if (e.target === back) closeModal(); });
  back.querySelectorAll('.mf button').forEach(btn => btn.onclick = async () => {
    const b = buttons[+btn.dataset.i];
    if (!b.fn) return closeModal();
    const r = await b.fn(btn);
    if (r !== false && b.fn !== doDeploy) closeModal();
  });
  curModal = back;
  return back;
}
function closeModal() { if (curModal) { curModal.remove(); curModal = null; } }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && curModal) closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); openDeploy(); }   // Ctrl+S = 저장·배포 창
});

/* ───────── 14. 시작 ───────── */
(async function init() {
  document.querySelectorAll('.side button[data-page]').forEach(b => b.onclick = () => go(b.dataset.page));
  loadSavedConn();
  const saved = store.get(K.page, 'connect');
  S.page = PAGES[saved] ? saved : 'connect';
  if (S.token) {
    S.page = S.page === 'connect' ? 'dashboard' : S.page;
    go(S.page);
    $('main').innerHTML = '<div class="card"><span class="spin"></span> GitHub에 연결해 최신 설정을 불러오는 중입니다...</div>';
    try { await testConnection(); await loadLatest(true); }
    catch (e) { toast(ghErrMsg(e), true); await loadPublic(); go('connect'); }
  } else {
    await loadPublic();
    go('connect');
  }
  updateTop();
})();
</script>
