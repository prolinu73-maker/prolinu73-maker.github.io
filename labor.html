<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노무관리 - 조효식 허브 PRO</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { 
            --primary-bg: #f8fafc; --text-main: #1e293b; --text-muted: #64748b; --primary-color: #10b981;
            --gradient-hero: linear-gradient(135deg, #047857 0%, #10b981 100%);
            --gradient-btn: linear-gradient(135deg, #059669 0%, #34d399 100%);
        }
        body { margin: 0; font-family: 'Pretendard', sans-serif; background-color: var(--primary-bg); color: var(--text-main); line-height: 1.6; }
        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 2px solid #e2e8f0; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; height: 70px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .logo { font-size: 24px; font-weight: 900; background: linear-gradient(to right, #059669, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        
        .auth-btn { background: #1e293b; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; font-family: 'Pretendard', sans-serif; text-decoration:none; display:flex; align-items:center; }
        .auth-btn:hover { background: #0f172a; }
        
        .hero { background: var(--gradient-hero); padding: 50px 20px; text-align: center; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .hero h2 { margin: 0 0 10px 0; font-size: 36px; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .hero p { margin: 0; font-size: 18px; opacity: 0.9; }

        .main-layout { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        .section-header { margin-bottom: 20px; border-bottom: 3px solid #cbd5e1; padding-bottom: 10px; }
        .section-header h3 { margin: 0; font-size: 22px; font-weight: 800; color: #1e293b; display: flex; align-items: center; gap: 8px; }
        
        /* 계산기 영역 (그리드 레이아웃) */
        .calc-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 50px; }
        @media (max-width: 768px) { .calc-container { grid-template-columns: 1fr; } }
        
        .calc-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid var(--primary-color); }
        .calc-box h4 { margin: 0 0 20px 0; font-size: 18px; color: #0f172a; text-align: center; background:#f1f5f9; padding: 10px; border-radius:8px;}
        
        .input-group { display: flex; align-items: center; margin-bottom: 15px; }
        .input-group label { flex: 0 0 140px; font-weight: 700; font-size: 14px; color: #475569; }
        .input-group input { flex: 1; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-family: 'Pretendard', sans-serif; font-size: 15px; text-align: right; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: var(--primary-color); }
        .input-group span.unit { margin-left: 10px; font-weight: 700; color: #64748b; font-size: 14px; }
        
        .result-box { margin-top: 20px; background: #ecfdf5; border: 1px dashed #34d399; padding: 15px; border-radius: 8px; text-align: center; }
        .result-box .label { font-size: 13px; color: #065f46; font-weight: 700; margin-bottom: 5px; }
        .result-box .value { font-size: 24px; font-weight: 900; color: #047857; }
        
        /* 게시판 영역 */
        .board-container { background: #ffffff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 60px;}
        .board-form { display: flex; gap: 10px; margin-bottom: 25px; padding-bottom: 25px; border-bottom: 2px dashed #e2e8f0; flex-wrap: wrap; }
        .board-form textarea.title-input { flex: 1 1 100%; height: 80px; padding: 12px 20px; border: 2px solid #e5e7eb; border-radius: 8px; font-family: 'Pretendard', sans-serif; font-size: 15px; box-sizing: border-box; resize: vertical; outline: none; transition: 0.2s; }
        .board-form textarea.title-input:focus { border-color: var(--primary-color); }
        
        .btn-submit { background: var(--gradient-btn); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); font-family: 'Pretendard', sans-serif; white-space: nowrap; }
        .btn-submit:hover { transform: scale(1.05); }

        .board-table { width: 100%; border-collapse: collapse; }
        .board-table th, .board-table td { padding: 16px 20px; text-align: left; border-bottom: 1px solid #f3f4f6; font-size: 15px; word-break: break-word; }
        .board-table th { background: #f8fafc; font-weight: 800; color: #475569; border-radius: 8px; }
        .board-table td.center, .board-table th.center { text-align: center; }

        .btn-micro-group { display: flex; gap: 3px; justify-content: center; align-items: center; flex-wrap: nowrap; }
        .btn-micro { padding: 4px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; border: none; white-space: nowrap; font-family: 'Pretendard', sans-serif; color: white; }
        .btn-edit-sm { background: #3b82f6; } .btn-edit-sm:hover { background: #2563eb; }
        .btn-delete-sm { background: #ef4444; } .btn-delete-sm:hover { background: #dc2626; }
        .btn-comment-sm { background: #64748b; } .btn-comment-sm:hover { background: #475569; }

        .admin-badge { background: #fef08a; color: #854d0e; padding: 2px 6px; border-radius: 12px; font-size: 10px; font-weight: 900; margin-left: 5px; vertical-align: middle; display: inline-block; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🚀 조효식 허브 PRO</a>
        <div class="header-right">
            <a href="index.html" class="auth-btn" style="background:#3b82f6;">🏠 메인 허브로 돌아가기</a>
        </div>
    </header>

    <div class="hero">
        <h2>⚖️ 스마트 노무관리 센터</h2>
        <p>복잡한 임금 계산과 노무 질의응답을 한 곳에서 해결하세요</p>
    </div>

    <div class="main-layout">
        
        <div class="section-header">
            <h3>🧮 통상임금 및 평균임금 계산기</h3>
        </div>
        
        <div class="calc-container">
            <!-- 통상임금 계산기 -->
            <div class="calc-box">
                <h4>시급제 통상임금 계산</h4>
                <div class="input-group">
                    <label>기본급 (월)</label>
                    <input type="number" id="ow_base" placeholder="0" oninput="calcOrdinaryWage()">
                    <span class="unit">원</span>
                </div>
                <div class="input-group">
                    <label>고정 수당 (월)</label>
                    <input type="number" id="ow_fixed" placeholder="0" oninput="calcOrdinaryWage()">
                    <span class="unit">원</span>
                </div>
                <div class="input-group">
                    <label>월 소정근로시간</label>
                    <input type="number" id="ow_hours" value="209" oninput="calcOrdinaryWage()">
                    <span class="unit">시간</span>
                </div>
                <div class="result-box">
                    <div class="label">시간당 통상임금 산출액</div>
                    <div class="value" id="ow_result">0원</div>
                </div>
            </div>

            <!-- 평균임금 계산기 -->
            <div class="calc-box" style="border-top-color: #3b82f6;">
                <h4>일급제 평균임금 계산 (퇴직금 등)</h4>
                <div class="input-group">
                    <label>최근 3개월 임금총액</label>
                    <input type="number" id="aw_total" placeholder="0" oninput="calcAverageWage()">
                    <span class="unit">원</span>
                </div>
                <div class="input-group">
                    <label>연간 상여금 총액</label>
                    <input type="number" id="aw_bonus" placeholder="0" oninput="calcAverageWage()">
                    <span class="unit">원</span>
                </div>
                <div class="input-group">
                    <label>연차수당 총액</label>
                    <input type="number" id="aw_leave" placeholder="0" oninput="calcAverageWage()">
                    <span class="unit">원</span>
                </div>
                <div class="input-group">
                    <label>3개월 총 일수</label>
                    <input type="number" id="aw_days" value="92" oninput="calcAverageWage()">
                    <span class="unit">일</span>
                </div>
                <div class="result-box" style="background:#eff6ff; border-color:#93c5fd;">
                    <div class="label" style="color:#1d4ed8;">1일 평균임금 산출액</div>
                    <div class="value" id="aw_result" style="color:#1d4ed8;">0원</div>
                </div>
            </div>
        </div>

        <div class="section-header">
            <h3>💬 노무 관련 질문ㆍ답변 게시판</h3>
        </div>
        
        <div class="board-container">
            <div class="board-form">
                <textarea id="postTitle" class="title-input" placeholder="인사, 복무, 급여, 노무 관련 궁금한 점을 질문하거나 답변을 남겨주세요." autocomplete="off"></textarea>
                <div style="display: flex; gap: 10px; margin-top: 10px; width: 100%; justify-content: flex-end; align-items: center;">
                    <input type="text" id="postAuthor" value="게스트" style="text-align: center; width: 150px; padding:10px; border:2px solid #e2e8f0; border-radius:8px;" placeholder="이름" autocomplete="off">
                    <input type="password" id="postGuestPw" style="text-align: center; width: 150px; padding:10px; border:2px solid #e2e8f0; border-radius:8px;" placeholder="🔒 게스트 비번" autocomplete="new-password">
                    <button class="btn-submit" onclick="addPost()">✨ 글 남기기</button>
                </div>
            </div>
            
            <table class="board-table">
                <thead>
                    <tr>
                        <th width="8%">번호</th>
                        <th>제목 및 내용</th>
                        <th width="14%">작성자</th>
                        <th width="12%" class="center">날짜</th>
                        <th width="18%" class="center">관리</th>
                    </tr>
                </thead>
                <tbody id="boardBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 계산기 로직
        function calcOrdinaryWage() {
            const base = Number(document.getElementById('ow_base').value) || 0;
            const fixed = Number(document.getElementById('ow_fixed').value) || 0;
            const hours = Number(document.getElementById('ow_hours').value) || 209;
            if(hours > 0) {
                const result = Math.floor((base + fixed) / hours);
                document.getElementById('ow_result').innerText = result.toLocaleString() + '원';
            } else {
                document.getElementById('ow_result').innerText = '0원';
            }
        }

        function calcAverageWage() {
            const total = Number(document.getElementById('aw_total').value) || 0;
            const bonus = Number(document.getElementById('aw_bonus').value) || 0;
            const leave = Number(document.getElementById('aw_leave').value) || 0;
            const days = Number(document.getElementById('aw_days').value) || 92;
            
            if(days > 0) {
                // 상여금 및 연차수당은 3/12 만 산입
                const calcTotal = total + (bonus * (3/12)) + (leave * (3/12));
                const result = Math.floor(calcTotal / days);
                document.getElementById('aw_result').innerText = result.toLocaleString() + '원';
            } else {
                document.getElementById('aw_result').innerText = '0원';
            }
        }

        // 파이어베이스 및 게시판 로직
        const ADMIN_PHONE = "010-9848-0309"; 

        const firebaseConfig = {
            apiKey: "AIzaSyCRmZ-OJKGhw0gOmTT63CE2T9e8kSD9dYw",
            authDomain: "prolinu73-6c409.firebaseapp.com",
            projectId: "prolinu73-6c409",
            storageBucket: "prolinu73-6c409.firebasestorage.app",
            messagingSenderId: "399358344473",
            appId: "1:399358344473:web:491d5e74448b4f0f029988",
            measurementId: "G-083RQKR8SQ"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let currentUser = JSON.parse(localStorage.getItem("currentUser")); 

        document.addEventListener("DOMContentLoaded", () => {
            updateLoginUI();
            loadPosts();
        });

        function updateLoginUI() {
            const postAuthor = document.getElementById('postAuthor');
            const postGuestPw = document.getElementById('postGuestPw');
            
            if (currentUser) {
                postAuthor.value = currentUser.name;
                postAuthor.readOnly = true;
                postAuthor.style.background = "#f1f5f9";
                postGuestPw.style.display = 'none';
            } else {
                postAuthor.value = "게스트";
                postAuthor.readOnly = false;
                postAuthor.style.background = "white";
                postGuestPw.style.display = 'inline-block';
            }
        }

        async function addPost() {
            const titleInput = document.getElementById("postTitle");
            const authorInput = document.getElementById("postAuthor");
            const guestPwInput = document.getElementById("postGuestPw");
            
            if (!titleInput.value.trim()) return alert("내용을 입력해주세요!");
            if (!currentUser && !guestPwInput.value.trim()) return alert("게스트 작성 시 삭제용 비밀번호를 입력해주세요.");
            
            const authorName = authorInput.value.trim() || "익명";
            const today = new Date();
            const dateStr = `${today.getMonth() + 1}.${today.getDate()}`;

            const postData = {
                title: titleInput.value,
                author: authorName,
                authorPhone: currentUser ? currentUser.phone : "guest",
                guestPw: currentUser ? null : guestPwInput.value.trim(),
                date: dateStr,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            try {
                await db.collection("laborQABoard").add(postData);
                titleInput.value = ""; 
                guestPwInput.value = "";
                loadPosts();
            } catch (error) {
                console.error("게시물 등록 오류:", error);
                alert("등록 중 오류가 발생했습니다.");
            }
        }

        async function loadPosts() {
            const boardBody = document.getElementById("boardBody");
            boardBody.innerHTML = `<tr><td colspan="5" class="center">데이터를 불러오는 중입니다...</td></tr>`; 
            
            const snapshot = await db.collection("laborQABoard").orderBy("createdAt", "desc").limit(50).get();
            boardBody.innerHTML = ""; 

            if (snapshot.empty) {
                boardBody.innerHTML = `<tr><td colspan="5" class="center" style="padding:40px; color:#94a3b8;">등록된 질문이 없습니다. 첫 질문을 남겨보세요!</td></tr>`;
                return;
            }

            const isAdmin = currentUser && currentUser.phone === ADMIN_PHONE;
            let index = snapshot.size;
            
            const fragment = document.createDocumentFragment();
            const commentPromises = [];

            snapshot.forEach(doc => {
                const post = doc.data();
                const isOwner = currentUser && currentUser.phone === post.authorPhone;
                const isGuestPost = post.authorPhone === "guest";
                
                let adminBtns = '';
                if (isAdmin) adminBtns += `<button class="btn-micro btn-edit-sm" onclick="editPost('${doc.id}', '${(post.title || '').replace(/'/g, "\\'")}')">수정</button>`;
                if (isAdmin || isOwner || isGuestPost) adminBtns += `<button class="btn-micro btn-delete-sm" onclick="deletePost('${doc.id}', '${post.authorPhone}', '${post.guestPw}')">삭제</button>`;

                const badge = (isAdmin && post.authorPhone === ADMIN_PHONE) ? `<span class="admin-badge">A</span>` : '';
                const commentBtn = `<button id="btn-comment-${doc.id}" class="btn-micro btn-comment-sm" onclick="toggleComments('${doc.id}')">💬 0</button>`;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="center">${index--}</td>
                    <td style="font-weight: 700; color: #1e293b; line-height: 1.5; font-size: 14px;">${post.title}</td>
                    <td class="center" style="font-weight: 600; font-size: 13px;">${post.author} ${badge}</td>
                    <td class="center" style="font-size: 12px; color: #64748b;">${post.date}</td>
                    <td class="center">
                        <div class="btn-micro-group">
                            ${commentBtn}
                            ${adminBtns}
                        </div>
                    </td>
                `;
                
                let guestInputs = '';
                if (!currentUser) {
                    guestInputs = `
                        <input type="text" id="comment-author-${doc.id}" placeholder="이름" style="width: 70px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; flex-shrink: 0;" autocomplete="off">
                        <input type="password" id="comment-pw-${doc.id}" placeholder="🔒 비번" style="width: 70px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; flex-shrink: 0;" autocomplete="new-password">
                    `;
                }

                const commentsTr = document.createElement("tr");
                commentsTr.id = `comments-row-${doc.id}`;
                commentsTr.style.display = "none";
                commentsTr.innerHTML = `
                    <td colspan="5" style="padding: 0; background: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                        <div style="padding: 15px 20px; border-left: 4px solid #10b981;">
                            <div id="comment-list-${doc.id}" style="margin-bottom: 10px;"></div>
                            <div style="display: flex; gap: 8px; align-items: center; width: 100%;">
                                ${guestInputs}
                                <input type="text" id="comment-text-${doc.id}" placeholder="답변이나 추가 의견을 남겨주세요..." style="flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Pretendard', sans-serif; font-size: 13px; outline: None; min-width: 0;" onkeypress="if(event.keyCode==13) addComment('${doc.id}')" autocomplete="off">
                                <button onclick="addComment('${doc.id}')" style="background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap;">등록</button>
                            </div>
                        </div>
                    </td>
                `;

                fragment.appendChild(tr);
                fragment.appendChild(commentsTr);

                commentPromises.push(
                    db.collection("laborQABoard").doc(doc.id).collection("comments").get().then(snap => {
                        const btn = document.getElementById(`btn-comment-${doc.id}`);
                        if(btn) btn.innerText = `💬 답변 ${snap.size}`;
                    })
                );
            });
            
            boardBody.appendChild(fragment);
            Promise.all(commentPromises).catch(console.error);
        }

        async function editPost(docId, currentTitle) {
            const newTitle = prompt("수정할 내용(제목)을 입력하세요:", currentTitle);
            if (newTitle === null) return;
            await db.collection("laborQABoard").doc(docId).update({ title: newTitle });
            loadPosts();
        }

        async function deletePost(docId, authorPhone, guestPwStr) {
            const isAdmin = currentUser && currentUser.phone === ADMIN_PHONE;
            const isOwner = currentUser && currentUser.phone === authorPhone;
            let canDelete = false;

            if (isAdmin || isOwner) {
                canDelete = confirm("이 게시글을 삭제하시겠습니까?");
            } else if (authorPhone === "guest") {
                const inputPw = prompt("게스트 작성 글입니다. 삭제용 비밀번호를 입력하세요.");
                if (inputPw === guestPwStr) canDelete = true;
                else if (inputPw !== null) alert("비밀번호가 일치하지 않습니다.");
            } else {
                alert("본인이 작성한 글만 삭제할 수 있습니다.");
            }
            
            if (canDelete) {
                await db.collection("laborQABoard").doc(docId).delete();
                loadPosts();
            }
        }

        // 댓글 기능 (Q&A)
        async function toggleComments(docId) {
            const row = document.getElementById(`comments-row-${docId}`);
            if (row.style.display === 'none' || row.style.display === '') {
                row.style.display = 'table-row';
                loadComments(docId);
            } else {
                row.style.display = 'none';
            }
        }
        
        async function loadComments(docId) {
            const listDiv = document.getElementById(`comment-list-${docId}`);
            listDiv.innerHTML = '<div style="padding: 5px; color: #64748b; font-size: 13px;">불러오는 중...</div>';
            
            const snapshot = await db.collection("laborQABoard").doc(docId).collection("comments").orderBy("createdAt", "asc").get();
            listDiv.innerHTML = '';
            
            if (snapshot.empty) {
                listDiv.innerHTML = '<div style="padding: 5px; color: #94a3b8; font-size: 12px;">등록된 답변이 없습니다.</div>';
                return;
            }
            
            const isAdmin = currentUser && currentUser.phone === ADMIN_PHONE;
            const fragment = document.createDocumentFragment();

            snapshot.forEach(docSnap => {
                const c = docSnap.data();
                const isOwner = currentUser && currentUser.phone === c.authorPhone;
                const isGuestPost = c.authorPhone === "guest";
                
                let delBtn = '';
                if (isAdmin || isOwner || isGuestPost) {
                    delBtn = `<span style="color: #ef4444; font-size: 11px; cursor: pointer; margin-left: 10px; font-weight:700;" onclick="deleteComment('${docId}', '${docSnap.id}', '${c.authorPhone}', '${c.guestPw}')">삭제</span>`;
                }
                
                const badge = (isAdmin && c.authorPhone === ADMIN_PHONE) ? `<span class="admin-badge">ADMIN</span>` : '';
                
                const commentWrap = document.createElement("div");
                commentWrap.innerHTML = `
                    <div style="padding: 10px; background: #ffffff; border-radius: 6px; margin-bottom: 6px; border: 1px solid #e2e8f0;">
                        <div style="display: flex; justify-content: space-between; align-items: baseline;">
                            <div>
                                <strong style="font-size: 13px; color: #334155;">${c.author}</strong> ${badge}
                                <span style="font-size: 11px; color: #94a3b8; margin-left: 8px;">${c.date}</span>
                            </div>
                            <div>${delBtn}</div>
                        </div>
                        <div style="font-size: 13px; color: #1e293b; margin-top: 4px; white-space: pre-wrap; line-height: 1.5;">${c.text}</div>
                    </div>
                `;
                fragment.appendChild(commentWrap);
            });
            
            listDiv.appendChild(fragment);
            const btn = document.getElementById(`btn-comment-${docId}`);
            if(btn) btn.innerText = `💬 답변 ${snapshot.size}`;
        }
        
        async function addComment(docId) {
            const textInput = document.getElementById(`comment-text-${docId}`);
            const authorInput = document.getElementById(`comment-author-${docId}`);
            const pwInput = document.getElementById(`comment-pw-${docId}`);
            
            if (!textInput.value.trim()) return alert("답변 내용을 입력해주세요!");
            if (!currentUser && (!authorInput || !authorInput.value.trim() || !pwInput || !pwInput.value.trim())) {
                return alert("게스트 작성 시 이름과 삭제용 비밀번호를 모두 입력해주세요.");
            }
            
            const authorName = currentUser ? currentUser.name : authorInput.value.trim();
            const authorPhone = currentUser ? currentUser.phone : "guest";
            const guestPw = currentUser ? null : pwInput.value.trim();
            
            const today = new Date();
            const dateStr = `${today.getMonth() + 1}.${today.getDate()} ${today.getHours()}:${String(today.getMinutes()).padStart(2, '0')}`;
            
            await db.collection("laborQABoard").add({
                text: textInput.value.trim(),
                author: authorName,
                authorPhone: authorPhone,
                guestPw: guestPw,
                date: dateStr,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }); // Note: This line had a bug in reference, I'll fix it in the string below to point to the subcollection correctly.
            
            await db.collection("laborQABoard").doc(docId).collection("comments").add({
                text: textInput.value.trim(),
                author: authorName,
                authorPhone: authorPhone,
                guestPw: guestPw,
                date: dateStr,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            textInput.value = '';
            if (pwInput) pwInput.value = '';
            
            loadComments(docId);
        }
        
        async function deleteComment(postDocId, commentDocId, authorPhone, guestPwStr) {
            const isAdmin = currentUser && currentUser.phone === ADMIN_PHONE;
            const isOwner = currentUser && currentUser.phone === authorPhone;
            let canDelete = false;
            
            if (isAdmin || isOwner) {
                canDelete = confirm("이 답변을 삭제하시겠습니까?");
            } else if (authorPhone === "guest") {
                const inputPw = prompt("게스트 작성 댓글입니다. 삭제용 비밀번호를 입력하세요.");
                if (inputPw === guestPwStr) canDelete = true;
                else if (inputPw !== null) alert("비밀번호가 일치하지 않습니다.");
            } else {
                alert("본인이 작성한 답변만 삭제할 수 있습니다.");
            }
            if(canDelete) {
                await db.collection("laborQABoard").doc(postDocId).collection("comments").doc(commentDocId).delete();
                loadComments(postDocId);
            }
        }
    </script>
</body>
</html>
