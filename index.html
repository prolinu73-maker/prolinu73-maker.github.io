<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조효식 허브 - 스마트 업무 플랫폼</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { 
            --primary-bg: #f3f4f6; 
            --text-main: #1f2937; 
            --text-muted: #6b7280;
            --gradient-hero: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-btn: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
        }
        
        body { margin: 0; font-family: 'Pretendard', sans-serif; background-color: var(--primary-bg); color: var(--text-main); line-height: 1.6; }
        
        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 2px solid #e5e7eb; padding: 0 40px; display: flex; justify-content: space-between; align-items: center; height: 70px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .logo { font-size: 24px; font-weight: 900; background: linear-gradient(to right, #f12711, #f5af19); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        #liveClock { font-weight: 700; color: #4f46e5; background: #e0e7ff; padding: 8px 15px; border-radius: 20px; font-size: 14px; }

        .hero { background: var(--gradient-hero); background-size: 200% 200%; animation: gradientMove 5s ease infinite; padding: 80px 20px; text-align: center; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        @keyframes gradientMove { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
        .hero h2 { margin: 0 0 15px 0; font-size: 40px; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .hero p { margin: 0; font-size: 20px; opacity: 0.9; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 3px solid #cbd5e1; padding-bottom: 10px; }
        .section-header h3 { margin: 0; font-size: 26px; font-weight: 800; color: #1e293b; }
        .search-box { padding: 10px 20px; width: 300px; border: 2px solid #a855f7; border-radius: 25px; font-size: 15px; outline: none; transition: 0.3s; }
        .search-box:focus { box-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }

        /* 도구 등록 폼 스타일 */
        .tool-form { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; display: grid; grid-template-columns: 1fr 1fr 2fr 100px; gap: 15px; align-items: center; }
        .tool-form input, .tool-form select { padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-family: 'Pretendard', sans-serif; font-size: 15px; }
        .tool-form input:focus, .tool-form select:focus { border-color: #a855f7; outline: none; }
        .tool-form .full-width { grid-column: 1 / -1; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-bottom: 60px; }
        .card { position: relative; background: #ffffff; border-radius: 15px; padding: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; text-decoration: none; color: inherit; border-top: 5px solid transparent; cursor: pointer; }
        .card:hover { transform: translateY(-10px) scale(1.02); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15); }
        .card.bg-blue { border-top-color: #3b82f6; }
        .card.bg-green { border-top-color: #10b981; }
        .card.bg-pink { border-top-color: #ec4899; }
        
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; color: white; margin-bottom: 15px; width: max-content; }
        .badge.blue { background: #3b82f6; }
        .badge.green { background: #10b981; }
        .badge.pink { background: #ec4899; }

        .card-title { font-size: 20px; font-weight: 800; margin: 0 0 12px 0; }
        .card-desc { font-size: 15px; color: var(--text-muted); margin: 0 0 20px 0; flex-grow: 1; }
        
        /* 카드 삭제 버튼 */
        .card-delete { position: absolute; top: 15px; right: 15px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; display: none; transition: 0.2s; }
        .card:hover .card-delete { display: block; }
        .card-delete:hover { background: #ef4444; color: white; }

        /* 커뮤니티 탭 및 폼 스타일 */
        .tabs { display: flex; gap: 10px; margin-bottom: 0; padding-top: 10px; }
        .tab-btn { padding: 12px 25px; font-size: 16px; font-weight: 800; border: none; background: #e2e8f0; color: #64748b; border-radius: 12px 12px 0 0; cursor: pointer; transition: 0.3s; font-family: 'Pretendard', sans-serif; }
        .tab-btn.active { background: #ffffff; color: #4f46e5; border-top: 4px solid #4f46e5; }
        
        .board-container { background: #ffffff; padding: 25px; border-radius: 0 12px 12px 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .board-form { display: flex; gap: 12px; align-items: center; margin-bottom: 25px; padding-bottom: 25px; border-bottom: 2px dashed #e2e8f0; }
        .board-select { padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-family: 'Pretendard', sans-serif; font-size: 15px; font-weight: 700; color: #475569; outline: none; }
        .board-form input { padding: 12px 20px; border: 2px solid #e5e7eb; border-radius: 8px; font-family: 'Pretendard', sans-serif; font-size: 15px; }
        .board-form input.title-input { flex-grow: 1; }
        
        .btn-submit { background: var(--gradient-btn); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 8, 68, 0.4); }
        .btn-submit:hover { transform: scale(1.05); }

        .board-table { width: 100%; border-collapse: collapse; }
        .board-table th, .board-table td { padding: 16px 20px; text-align: left; border-bottom: 1px solid #f3f4f6; font-size: 15px; }
        .board-table th { background: #f8fafc; font-weight: 800; color: #475569; border-radius: 8px; }
        .board-table td.center { text-align: center; }
        
        .btn-like { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">🚀 조효식 허브 PRO</a>
        <div id="liveClock">시간 로딩중...</div>
    </header>

    <div class="hero">
        <h2>현장을 가장 잘 아는 사람이, 현장을 바꿉니다</h2>
        <p>전라남도교육청 실무에 최적화된 차세대 업무 자동화 플랫폼</p>
    </div>

    <div class="container">
        <!-- 업무효율화 앱 섹션 헤더 -->
        <div class="section-header">
            <h3>💡 스마트 업무 도구</h3>
            <input type="text" id="searchInput" class="search-box" placeholder="실행할 도구 이름을 검색하세요..." onkeyup="filterCards()">
        </div>

        <!-- 도구 등록(업로드) 폼 -->
        <div class="tool-form">
            <select id="toolCategory">
                <option value="blue">인사 · 복무 (파랑)</option>
                <option value="green">재산 · 회계 (초록)</option>
                <option value="pink">문서 · 디자인 (핑크)</option>
            </select>
            <input type="text" id="toolTitle" placeholder="도구 이름 (예: 인사관리 시스템)">
            <input type="text" id="toolLink" placeholder="파일명 또는 링크 (예: main.accdb 또는 https://...)">
            <button class="btn-submit" onclick="addTool()" style="padding: 12px; width: 100%;">등록</button>
            <input type="text" id="toolDesc" class="full-width" placeholder="도구에 대한 상세 설명을 입력하세요 (카드 본문에 표시됩니다)">
        </div>
        
        <!-- 동적으로 도구 카드가 추가될 공간 -->
        <div class="grid" id="cardGrid"></div>

        <!-- 커뮤니티 라운지 -->
        <div class="section-header" style="margin-top: 60px; margin-bottom: 10px; border:none;">
            <h3>💬 커뮤니티 라운지</h3>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tab-free" onclick="switchTab('free')">🎈 자유게시판</button>
            <button class="tab-btn" id="tab-qa" onclick="switchTab('qa')">❓ 묻고 답하기</button>
        </div>

        <div class="board-container">
            <div class="board-form">
                <select id="boardSelect" class="board-select">
                    <option value="free">자유게시판</option>
                    <option value="qa">묻고 답하기</option>
                </select>
                <input type="text" id="postTitle" class="title-input" placeholder="내용을 입력해주세요!">
                <input type="text" id="postAuthor" value="조효식" style="width: 100px; text-align: center;">
                <button class="btn-submit" onclick="addPost()">✨ 등록하기</button>
            </div>
            <table class="board-table">
                <thead>
                    <tr>
                        <th width="8%">번호</th>
                        <th>제목</th>
                        <th width="12%">작성자</th>
                        <th width="12%" class="center">날짜</th>
                        <th width="20%" class="center">반응 / 관리</th>
                    </tr>
                </thead>
                <tbody id="boardBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 기능 구현 스크립트 -->
    <script>
        // 1. 공통 기능 (시계 및 검색)
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateString = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
            document.getElementById('liveClock').innerText = `${dateString} ${timeString}`;
        }
        setInterval(updateClock, 1000); updateClock();

        function filterCards() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const cards = document.querySelectorAll(".card");
            cards.forEach(card => {
                const title = card.querySelector(".card-title").innerText.toLowerCase();
                const desc = card.querySelector(".card-desc").innerText.toLowerCase();
                card.style.display = (title.includes(query) || desc.includes(query)) ? "flex" : "none";
            });
        }

        // 2. 스마트 업무 도구 (카드) 관리 시스템
        document.addEventListener("DOMContentLoaded", () => {
            initTools();
            loadPosts(); 
        });

        // 초기 기본 도구 세팅 및 로드
        function initTools() {
            let tools = JSON.parse(localStorage.getItem("smartTools"));
            // 만약 저장된 도구가 아예 없다면(최초 접속 시), 기본 도구 3개를 생성해줍니다.
            if (!tools) {
                tools = [
                    { id: 1, category: 'blue', title: '교육공무직 인사관리 시스템', desc: '연차 조정, 퇴직금 계산, 인사 기록을 한 번에 통합 관리하는 실무용 Access VBA 시스템입니다.', link: '교육공무직인사관리_v2.accdb', badgeText: '인사 · 복무' },
                    { id: 2, category: 'green', title: '온비드 공용차량 매각 서식', desc: '내용연수를 초과한 차량의 14일 관리전환 소요조회 및 온비드 공매 처분 표준 기안문', link: '#', badgeText: '재산 · 회계' },
                    { id: 3, category: 'pink', title: '여백 없는 민방위 교육 HWP', desc: '프린터 여백 없이 꽉 찬 고품질 책자 표지를 출력하기 위한 아래한글(HWPX) 바탕쪽 템플릿', link: '#', badgeText: '문서 · 디자인' }
                ];
                localStorage.setItem("smartTools", JSON.stringify(tools));
            }
            loadTools();
        }

        // 도구 목록을 화면에 그리기
        function loadTools() {
            const grid = document.getElementById("cardGrid");
            grid.innerHTML = "";
            let tools = JSON.parse(localStorage.getItem("smartTools")) || [];

            tools.forEach(tool => {
                // a 태그(카드) 생성
                const card = document.createElement("a");
                card.href = tool.link;
                card.className = `card bg-${tool.category}`;
                
                // 카드 안의 내용을 채워넣음
                card.innerHTML = `
                    <button class="card-delete" onclick="deleteTool(event, ${tool.id})" title="도구 삭제">✖</button>
                    <div class="badge ${tool.category}">${tool.badgeText}</div>
                    <h4 class="card-title">${tool.title}</h4>
                    <p class="card-desc">${tool.desc}</p>
                `;
                grid.appendChild(card);
            });
        }

        // 새로운 도구 등록(업로드) 기능
        function addTool() {
            const categorySelect = document.getElementById("toolCategory");
            const titleInput = document.getElementById("toolTitle");
            const linkInput = document.getElementById("toolLink");
            const descInput = document.getElementById("toolDesc");

            if (!titleInput.value.trim() || !linkInput.value.trim()) {
                return alert("도구 이름과 링크(파일명)를 모두 입력해주세요!");
            }

            // 카테고리(색상)에 따라 뱃지 텍스트 자동 지정
            let badgeText = "기타 · 공통";
            if(categorySelect.value === "blue") badgeText = "인사 · 복무";
            if(categorySelect.value === "green") badgeText = "재산 · 회계";
            if(categorySelect.value === "pink") badgeText = "문서 · 디자인";

            const newTool = {
                id: Date.now(),
                category: categorySelect.value,
                title: titleInput.value,
                link: linkInput.value,
                desc: descInput.value || "설명이 없습니다.",
                badgeText: badgeText
            };

            let tools = JSON.parse(localStorage.getItem("smartTools")) || [];
            tools.push(newTool); // 새 도구를 목록 끝에 추가
            localStorage.setItem("smartTools", JSON.stringify(tools));

            // 입력창 초기화 및 화면 갱신
            titleInput.value = ""; linkInput.value = ""; descInput.value = "";
            loadTools();
        }

        // 도구 삭제 기능
        function deleteTool(event, id) {
            event.preventDefault(); // 카드(a 태그) 클릭 시 링크로 이동하는 것을 방지
            
            if (confirm("이 업무 도구를 목록에서 삭제하시겠습니까? (실제 파일이 지워지지는 않습니다)")) {
                let tools = JSON.parse(localStorage.getItem("smartTools")) || [];
                tools = tools.filter(tool => tool.id !== id);
                localStorage.setItem("smartTools", JSON.stringify(tools));
                loadTools();
            }
        }

        // 3. 커뮤니티 게시판 기능 (기존과 동일)
        let currentTab = 'free';

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('boardSelect').value = tabName;
            loadPosts();
        }

        function getStorageKey() { return currentTab === 'free' ? 'freeBoardData' : 'qaBoardData'; }

        function addPost() {
            const titleInput = document.getElementById("postTitle");
            const authorInput = document.getElementById("postAuthor");
            const selectedBoard = document.getElementById("boardSelect").value;
            
            if (!titleInput.value.trim()) return alert("제목을 입력해주세요!");

            const today = new Date();
            const dateStr = `${today.getMonth() + 1}.${today.getDate()}`;
            const newPost = { id: Date.now(), title: titleInput.value, author: authorInput.value, date: dateStr, likes: 0 };

            const storageKey = selectedBoard === 'free' ? 'freeBoardData' : 'qaBoardData';
            let posts = JSON.parse(localStorage.getItem(storageKey)) || [];
            posts.unshift(newPost);
            localStorage.setItem(storageKey, JSON.stringify(posts));

            titleInput.value = "";
            if (currentTab !== selectedBoard) switchTab(selectedBoard); else loadPosts();
        }

        function likePost(id) {
            const storageKey = getStorageKey();
            let posts = JSON.parse(localStorage.getItem(storageKey)) || [];
            const postIndex = posts.findIndex(p => p.id === id);
            if(postIndex !== -1) {
                posts[postIndex].likes = (posts[postIndex].likes || 0) + 1;
                localStorage.setItem(storageKey, JSON.stringify(posts));
                loadPosts();
            }
        }

        function deletePost(id) {
            if (confirm("이 게시글을 삭제하시겠습니까?")) {
                const storageKey = getStorageKey();
                let posts = JSON.parse(localStorage.getItem(storageKey)) || [];
                posts = posts.filter(post => post.id !== id);
                localStorage.setItem(storageKey, JSON.stringify(posts));
                loadPosts();
            }
        }

        function loadPosts() {
            const boardBody = document.getElementById("boardBody");
            boardBody.innerHTML = ""; 
            const storageKey = getStorageKey();
            let posts = JSON.parse(localStorage.getItem(storageKey)) || [];

            if (posts.length === 0) {
                const boardName = currentTab === 'free' ? '자유게시판' : '묻고 답하기';
                boardBody.innerHTML = `<tr><td colspan="5" class="center" style="padding:40px; color:#94a3b8;">${boardName}에 등록된 글이 없습니다.</td></tr>`;
                return;
            }

            posts.forEach((post, index) => {
                const likes = post.likes || 0;
                const titlePrefix = currentTab === 'qa' ? '<span style="color:#ec4899; font-weight:900; margin-right:5px;">Q.</span>' : '';
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${posts.length - index}</td>
                    <td style="font-weight: 700; color: #1e293b;">${titlePrefix}${post.title}</td>
                    <td style="font-weight: 600;">${post.author}</td>
                    <td class="center">${post.date}</td>
                    <td class="center">
                        <button class="btn-like" onclick="likePost(${post.id})">👍 ${likes}</button>
                        <button class="btn-delete" onclick="deletePost(${post.id})">삭제</button>
                    </td>
                `;
                boardBody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
